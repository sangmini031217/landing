<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 출하 물량 예측 | 제주모아</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <style>
    .ai-layout { display: grid; grid-template-columns: 380px 1fr; gap: 20px; align-items: start; }
    /* 입력 패널 */
    .input-panel { position: sticky; top: calc(var(--header-h) + 20px); }
    .step-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--app-primary); color: #fff;
      font-size: 0.7rem; font-weight: 800; flex-shrink: 0;
    }
    /* 결과 카드 그리드 */
    .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
    .result-tile {
      background: var(--app-surface);
      border: 1px solid var(--app-border);
      border-radius: var(--r-lg);
      padding: 20px;
      text-align: center;
      box-shadow: var(--shadow-xs);
    }
    .result-tile-icon { font-size: 1.6rem; margin-bottom: 6px; }
    .result-tile-val {
      font-size: 1.55rem; font-weight: 900; color: var(--app-text);
      letter-spacing: -0.5px; margin-bottom: 4px;
    }
    .result-tile-val.blue   { color: var(--app-primary); }
    .result-tile-val.green  { color: var(--app-green-dark); }
    .result-tile-val.orange { color: var(--app-orange); }
    .result-tile-label { font-size: 0.78rem; color: var(--app-text-sub); font-weight: 600; }
    /* 막대 차트 */
    .bar-chart { display: flex; flex-direction: column; gap: 10px; }
    .bar-row { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; }
    .bar-label { width: 80px; color: var(--app-text-sub); font-weight: 600; flex-shrink: 0; }
    .bar-track { flex: 1; height: 10px; background: var(--app-border); border-radius: var(--r-full); overflow: hidden; }
    .bar-fill { height: 100%; border-radius: var(--r-full); background: var(--app-primary); transition: width 0.8s cubic-bezier(.4,0,.2,1); width: 0; }
    .bar-fill.green  { background: var(--app-green); }
    .bar-fill.orange { background: var(--app-orange); }
    .bar-val { width: 60px; text-align: right; font-weight: 700; color: var(--app-text); font-size: 0.82rem; }
    /* AI 분석 로그 */
    .ai-log {
      background: #0f172a; border-radius: var(--r-md);
      padding: 18px 20px; font-family: 'Courier New', monospace;
      font-size: 0.78rem; line-height: 1.8; color: #94a3b8;
      max-height: 200px; overflow-y: auto;
    }
    .ai-log .log-ok   { color: #4ade80; }
    .ai-log .log-warn { color: #fbbf24; }
    .ai-log .log-head { color: #60a5fa; font-weight: 700; }
    /* 플레이스홀더 */
    .result-placeholder {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 80px 0; color: var(--app-text-muted);
      gap: 12px;
    }
    .result-placeholder-icon { font-size: 3rem; }
    .result-placeholder-text { font-size: 0.95rem; font-weight: 600; }
    /* 지역 통합 물량 테이블 */
    .region-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    .region-table th { padding: 10px 12px; background: var(--app-bg); font-size: 0.78rem; font-weight: 700; color: var(--app-text-sub); text-align: left; border-bottom: 1px solid var(--app-border); }
    .region-table td { padding: 11px 12px; border-bottom: 1px solid var(--app-border); }
    .region-table tr:last-child td { border-bottom: none; }
    @media (max-width: 960px) {
      .ai-layout { grid-template-columns: 1fr; }
      .input-panel { position: static; }
      .result-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .result-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<header class="app-header" id="appHeader">
  <div class="app-header-inner">
    <a href="../index.html" class="app-logo">
      <div class="app-logo-icon"><img src="../assets/images/hero-main.png" alt="제주모아" /></div>
      <span class="app-logo-text">제주<span>모아</span></span>
    </a>
    <nav class="app-nav">
      <a href="../index.html" class="app-nav-link">홈</a>
      <a href="ai-harvest.html" class="app-nav-link active">AI 출하예측</a>
      <a href="logistics.html" class="app-nav-link">물류 최적화</a>
    </nav>
    <div class="app-header-user">
      <div class="app-user-chip">
        <div class="app-user-avatar" id="userAvatar">?</div>
        <div class="app-user-info">
          <span class="app-user-name" data-user-name>-</span>
          <span class="app-user-role" data-user-role>-</span>
        </div>
      </div>
      <button class="app-logout-btn" data-logout-btn>로그아웃</button>
    </div>
  </div>
</header>

<div class="app-page-bar">
  <div class="app-container">
    <div class="app-page-bar-inner">
      <div class="app-page-bar-left">
        <span class="app-page-tag">🤖 AI 분석</span>
        <h1 class="app-page-title">출하 물량 <span>AI 예측</span></h1>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="live-dot"></span>
        <span style="font-size:0.82rem;color:var(--app-text-sub);font-weight:600;">실시간 기상 데이터 연동 중</span>
      </div>
    </div>
  </div>
</div>

<main class="app-main">
  <div class="app-container">
    <div class="ai-layout">

      <!-- 왼쪽: 입력 패널 -->
      <div class="input-panel">
        <div class="app-card">
          <div class="app-card-title"><span>📋</span> 농가 정보 입력</div>

          <div class="app-field">
            <label class="app-label">
              <span class="step-badge">1</span>&nbsp; 작물 종류 <span class="req">*</span>
            </label>
            <select class="app-select" id="inCrop">
              <option value="">선택하세요</option>
              <option value="감귤">🍊 감귤</option>
              <option value="당근">🥕 당근</option>
              <option value="브로콜리">🥦 브로콜리</option>
              <option value="한라봉">🍊 한라봉</option>
              <option value="천혜향">🍊 천혜향</option>
              <option value="감자">🥔 감자</option>
              <option value="양배추">🥬 양배추</option>
            </select>
          </div>
          <div class="app-field">
            <label class="app-label">
              <span class="step-badge">2</span>&nbsp; 재배 면적 (㎡) <span class="req">*</span>
            </label>
            <input class="app-input" type="number" id="inArea" placeholder="예: 3200" min="100" />
          </div>
          <div class="app-field">
            <label class="app-label">
              <span class="step-badge">3</span>&nbsp; 식재 수량 (그루/포기)
            </label>
            <input class="app-input" type="number" id="inTrees" placeholder="예: 150" min="1" />
          </div>
          <div class="app-field">
            <label class="app-label">
              <span class="step-badge">4</span>&nbsp; 나무/작물 수령 (년)
            </label>
            <input class="app-input" type="number" id="inAge" placeholder="예: 12" min="1" />
          </div>
          <div class="app-field">
            <label class="app-label">
              <span class="step-badge">5</span>&nbsp; 현재 성숙도 (%)
            </label>
            <input class="app-input" type="number" id="inMaturity" placeholder="0 ~ 100" min="0" max="100" />
            <div class="app-input-hint">현재 착색도·당도 기준 성숙도를 입력하세요.</div>
          </div>
          <div class="app-field">
            <label class="app-label">
              <span class="step-badge">6</span>&nbsp; 예상 출하 시기
            </label>
            <input class="app-input" type="month" id="inMonth" />
          </div>

          <button class="app-btn app-btn-primary app-btn-full" id="analyzeBtn" onclick="runAnalysis()" style="margin-top:4px;">
            🤖 AI 분석 시작
          </button>
          <button class="app-btn app-btn-secondary app-btn-full" onclick="loadFromFarm()" style="margin-top:8px;">
            🌾 내 농가 정보 불러오기
          </button>
        </div>
      </div>

      <!-- 오른쪽: 결과 -->
      <div id="resultArea">
        <div class="result-placeholder" id="resultPlaceholder">
          <div class="result-placeholder-icon">🤖</div>
          <div class="result-placeholder-text">농가 정보를 입력하고 AI 분석을 시작하세요.</div>
        </div>
      </div>

    </div>
  </div>
</main>

<div class="app-toast-wrap" id="toastWrap"></div>

<script src="../js/auth.js"></script>
<script>
  JMAuth.requireLogin();
  JMAuth.injectUserUI();
  var user = JMAuth.currentUser();
  if (user) document.getElementById('userAvatar').textContent = (user.name||'?')[0];
  window.addEventListener('scroll', function(){ document.getElementById('appHeader').classList.toggle('scrolled', window.scrollY>10); }, {passive:true});

  /* 내 농가 정보 자동 불러오기 */
  function loadFromFarm() {
    if (!user) return;
    var farm = JSON.parse(localStorage.getItem('jmoa_farm_' + user.id) || 'null');
    if (!farm) { showToast('등록된 농가 정보가 없습니다. 먼저 농가를 등록해주세요.', 'error'); return; }
    document.getElementById('inCrop').value     = farm.cropType || '';
    document.getElementById('inArea').value     = farm.area || '';
    document.getElementById('inTrees').value    = farm.treeCount || '';
    document.getElementById('inAge').value      = farm.treeAge || '';
    document.getElementById('inMonth').value    = farm.expectedDate || '';
    showToast('농가 정보를 불러왔습니다.', 'success');
  }

  /* AI 분석 실행 */
  function runAnalysis() {
    var crop     = document.getElementById('inCrop').value;
    var area     = parseFloat(document.getElementById('inArea').value);
    var trees    = parseInt(document.getElementById('inTrees').value) || 0;
    var age      = parseInt(document.getElementById('inAge').value) || 5;
    var maturity = parseInt(document.getElementById('inMaturity').value) || 70;
    var month    = document.getElementById('inMonth').value;

    if (!crop || !area) { showToast('작물 종류와 재배 면적은 필수입니다.', 'error'); return; }

    var btn = document.getElementById('analyzeBtn');
    btn.disabled = true; btn.textContent = '⏳ AI 분석 중...';

    /* 시뮬레이션 딜레이 */
    setTimeout(function() {
      var result = calcPrediction(crop, area, trees, age, maturity, month);
      renderResult(result, crop, maturity, month);
      btn.disabled = false; btn.textContent = '🤖 AI 분석 시작';

      /* 활동 기록 */
      if (user) {
        var key = 'jmoa_activity_' + user.id;
        var list = JSON.parse(localStorage.getItem(key) || '[]');
        list.unshift({ icon:'🤖', colorClass:'ic-blue', title:'AI 출하 물량 예측 완료',
          sub: crop + ' · 예상 ' + result.production.toLocaleString() + 'kg', time: now() });
        if (list.length>20) list=list.slice(0,20);
        localStorage.setItem(key, JSON.stringify(list));
      }
    }, 1600);
  }

  /* 예측 계산 로직 */
  function calcPrediction(crop, area, trees, age, maturity, month) {
    /* 작물별 단위 수확량 계수 (kg/㎡) */
    var yieldMap = { '감귤':10.2,'당근':7.8,'브로콜리':4.5,'한라봉':9.5,'천혜향':9.8,'감자':6.2,'양배추':5.8 };
    var baseYield = yieldMap[crop] || 8.0;

    /* 수령 보정 (오래된 나무일수록 수확량↑, 20년 이후 감소) */
    var ageFactor = age <= 5 ? 0.6 : age <= 15 ? 1.0 : age <= 25 ? 1.15 : 0.9;
    /* 성숙도 보정 */
    var matFactor = maturity >= 90 ? 1.0 : maturity >= 70 ? 0.88 : 0.72;
    /* 기상 변동성 시뮬레이션 (±8%) */
    var weatherFactor = 0.92 + Math.random() * 0.16;

    var production    = Math.round(area * baseYield * ageFactor * matFactor * weatherFactor);
    var boxes15       = Math.ceil(production / 15);
    var boxes10       = Math.ceil(production / 10);
    var vehicles1t    = Math.ceil(production / 900);
    var vehicles25t   = Math.ceil(production / 2200);
    var daysToHarvest = Math.round((100 - maturity) * 0.45);
    var accuracy      = Math.round(88 + Math.random() * 8);
    var savingAmt     = Math.round(production * 18 * 0.35);
    var boxRevenue    = Math.round(production * 1200); /* 감귤 기준 kg당 1,200원 */

    return { production, boxes15, boxes10, vehicles1t, vehicles25t, daysToHarvest, accuracy, savingAmt, boxRevenue, ageFactor, matFactor, weatherFactor };
  }

  /* 결과 렌더링 */
  function renderResult(r, crop, maturity, month) {
    var harvestDate = month
      ? month.replace('-', '년 ') + '월 예정'
      : '약 D-' + r.daysToHarvest + '일 후';

    var html = '';

    /* KPI 타일 */
    html += '<div class="result-grid">';
    html += tile('⚖️', r.production.toLocaleString() + ' kg', '예상 생산량', 'blue');
    html += tile('📦', r.boxes15.toLocaleString() + ' 박스', '박스 수량 (15kg)', '');
    html += tile('🚚', r.vehicles1t + ' 대', '필요 차량 (1톤)', 'orange');
    html += tile('📅', harvestDate, '출하 예정', 'green');
    html += tile('🎯', r.accuracy + '%', 'AI 신뢰도', '');
    html += tile('💰', '₩' + r.savingAmt.toLocaleString(), '물류비 절감(예상)', 'green');
    html += '</div>';

    /* 막대 차트 — 지역 농가 통합 시뮬레이션 */
    var regionData = buildRegionData(r.production, crop);
    html += '<div class="app-card" style="margin-bottom:20px;">';
    html += '<div class="app-card-title"><span>📊</span> 지역 농가 통합 출하 물량 예측</div>';
    html += '<div class="bar-chart" id="barChart">';
    var maxVal = Math.max.apply(null, regionData.map(function(d){ return d.val; }));
    regionData.forEach(function(d, i) {
      var pct = Math.round((d.val / maxVal) * 100);
      html += '<div class="bar-row">'
        + '<div class="bar-label">' + d.label + '</div>'
        + '<div class="bar-track"><div class="bar-fill ' + (i===0?'':'') + '" data-w="' + pct + '" style="width:0%"></div></div>'
        + '<div class="bar-val">' + d.val.toLocaleString() + 't</div>'
        + '</div>';
    });
    html += '</div></div>';

    /* AI 분석 로그 */
    html += '<div class="app-card" style="margin-bottom:20px;">';
    html += '<div class="app-card-title"><span>🖥️</span> AI 분석 로그</div>';
    html += '<div class="ai-log" id="aiLog"></div></div>';

    /* 지역 통합 배차 테이블 */
    html += '<div class="app-card">';
    html += '<div class="app-card-title"><span>🗺️</span> 지역 통합 배차 추천</div>';
    html += '<table class="region-table"><thead><tr><th>농가</th><th>지역</th><th>출하량</th><th>배차</th><th>상태</th></tr></thead><tbody>';
    buildDispatchRows(r.production, crop).forEach(function(row) {
      html += '<tr><td><strong>' + row.farm + '</strong></td><td>' + row.region + '</td>'
        + '<td>' + row.amount + ' kg</td><td>' + row.vehicle + '</td>'
        + '<td><span class="app-badge app-badge-' + row.badgeClass + '">' + row.status + '</span></td></tr>';
    });
    html += '</tbody></table>';
    html += '<div style="margin-top:14px;display:flex;gap:10px;">'
      + '<a href="logistics.html" class="app-btn app-btn-primary app-btn-sm">🗺️ 물류 경로 최적화 →</a>'
      + '<a href="vehicle-matching.html" class="app-btn app-btn-secondary app-btn-sm">🚚 차량 매칭 →</a>'
      + '</div></div>';

    document.getElementById('resultArea').innerHTML = html;

    /* 막대 애니메이션 */
    setTimeout(function() {
      document.querySelectorAll('.bar-fill').forEach(function(el) {
        el.style.width = el.dataset.w + '%';
      });
    }, 100);

    /* AI 로그 타이핑 효과 */
    typeLog(r, crop, maturity);
  }

  function tile(icon, val, label, colorClass) {
    return '<div class="result-tile">'
      + '<div class="result-tile-icon">' + icon + '</div>'
      + '<div class="result-tile-val ' + colorClass + '">' + val + '</div>'
      + '<div class="result-tile-label">' + label + '</div>'
      + '</div>';
  }

  function buildRegionData(myProd, crop) {
    var base = myProd / 1000;
    return [
      { label: '내 농가',   val: Math.round(base * 1.0 * 10) / 10 },
      { label: '한림읍',    val: Math.round(base * 2.4 * 10) / 10 },
      { label: '애월읍',    val: Math.round(base * 1.9 * 10) / 10 },
      { label: '서귀포',    val: Math.round(base * 3.1 * 10) / 10 },
      { label: '남원읍',    val: Math.round(base * 1.6 * 10) / 10 },
      { label: '표선면',    val: Math.round(base * 1.2 * 10) / 10 },
    ];
  }

  function buildDispatchRows(myProd, crop) {
    var emoji = { '감귤':'🍊','당근':'🥕','브로콜리':'🥦','한라봉':'🍊','천혜향':'🍊','감자':'🥔','양배추':'🥬' };
    var em = emoji[crop] || '🌾';
    var v1 = Math.ceil(myProd / 900);
    return [
      { farm: em + ' 내 농가', region: '입력 지역', amount: myProd.toLocaleString(), vehicle: '1톤 × ' + v1 + '대', status: '매칭 예정', badgeClass: 'blue' },
      { farm: '🍊 한림A 농가', region: '제주시 한림읍', amount: Math.round(myProd * 0.6).toLocaleString(), vehicle: '1톤 × 2대', status: '배차완료', badgeClass: 'green' },
      { farm: '🥕 애월B 농가', region: '제주시 애월읍', amount: Math.round(myProd * 0.4).toLocaleString(), vehicle: '2.5톤 × 1대', status: '배차완료', badgeClass: 'green' },
      { farm: '🍊 남원C 농가', region: '서귀포 남원읍', amount: Math.round(myProd * 0.8).toLocaleString(), vehicle: '🤖 AI 분석중', status: '대기', badgeClass: 'orange' },
    ];
  }

  function typeLog(r, crop, maturity) {
    var el = document.getElementById('aiLog');
    if (!el) return;
    var lines = [
      { cls:'log-head', text:'[제주모아 AI v2.1] 출하 물량 예측 시작...' },
      { cls:'log-ok',   text:'✓ 기상청 데이터 로드 완료 (최근 30일)' },
      { cls:'log-ok',   text:'✓ 작물 생육 모델 로드: ' + crop },
      { cls:'log-ok',   text:'✓ 농가 데이터 연동 완료' },
      { cls:'',         text:'  > 재배면적 × 단위수확량 계수 계산 중...' },
      { cls:'',         text:'  > 수령 보정 인자: ' + r.ageFactor.toFixed(2) },
      { cls:'',         text:'  > 성숙도 보정 인자: ' + r.matFactor.toFixed(2) + ' (현재 ' + maturity + '%)' },
      { cls:maturity>=80?'log-ok':'log-warn', text: maturity>=80 ? '✓ 성숙도 양호 — 수확 적기 판단' : '⚠ 성숙도 부족 — 수확까지 약 ' + r.daysToHarvest + '일 필요' },
      { cls:'',         text:'  > 기상 변동성 적용: ×' + r.weatherFactor.toFixed(3) },
      { cls:'log-ok',   text:'✓ 지역 농가 통합 물량 시뮬레이션 완료' },
      { cls:'log-ok',   text:'✓ 최적 배차 계산 완료: 1톤 ' + r.vehicles1t + '대 / 2.5톤 ' + r.vehicles25t + '대' },
      { cls:'log-head', text:'━━ 예측 완료 | 신뢰도 ' + r.accuracy + '% ━━' },
    ];
    var i = 0;
    el.innerHTML = '';
    function next() {
      if (i >= lines.length) return;
      var span = document.createElement('div');
      if (lines[i].cls) span.className = lines[i].cls;
      span.textContent = lines[i].text;
      el.appendChild(span);
      el.scrollTop = el.scrollHeight;
      i++;
      setTimeout(next, 90);
    }
    next();
  }

  function now() { return new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }
  function showToast(msg, type) {
    var wrap = document.getElementById('toastWrap');
    var t = document.createElement('div');
    t.className = 'app-toast' + (type?' '+type:'');
    t.textContent = msg;
    wrap.appendChild(t);
    requestAnimationFrame(function(){ t.classList.add('show'); });
    setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ t.remove(); },300); }, 2800);
  }
</script>
</body>
</html>
