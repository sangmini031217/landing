<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 · 회원가입 | 제주모아</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <style>
    body { background: var(--app-bg); display: flex; flex-direction: column; min-height: 100vh; }

    /* ── 로고 영역 ── */
    .auth-header {
      padding: 28px 0 0;
      text-align: center;
    }
    .auth-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .auth-logo-icon {
      width: 44px; height: 44px;
      border-radius: 14px;
      background: var(--app-primary-light);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      box-shadow: var(--shadow-sm);
    }
    .auth-logo-text {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--app-text);
      letter-spacing: -0.5px;
    }
    .auth-logo-text span { color: var(--app-primary); }

    /* ── 카드 ── */
    .auth-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px 60px;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--app-surface);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    /* ── 탭 ── */
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--app-border);
    }
    .auth-tab {
      padding: 16px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--app-text-sub);
      background: transparent;
      border: none;
      border-bottom: 2.5px solid transparent;
      margin-bottom: -1px;
      transition: var(--tr);
      cursor: pointer;
    }
    .auth-tab.active {
      color: var(--app-primary);
      border-bottom-color: var(--app-primary);
      background: var(--app-surface);
    }

    /* ── 폼 패널 ── */
    .auth-panel { padding: 32px 32px 28px; display: none; }
    .auth-panel.active { display: block; }

    .auth-panel-title {
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--app-text);
      margin-bottom: 6px;
      letter-spacing: -0.4px;
    }
    .auth-panel-sub {
      font-size: 0.88rem;
      color: var(--app-text-sub);
      margin-bottom: 28px;
    }

    /* 역할 선택 */
    .role-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .role-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 14px 8px;
      border: 1.5px solid var(--app-border-mid);
      border-radius: var(--r-md);
      background: var(--app-bg);
      cursor: pointer;
      transition: var(--tr);
      font-family: inherit;
    }
    .role-btn:hover { border-color: var(--app-primary); background: var(--app-primary-light); }
    .role-btn.selected {
      border-color: var(--app-primary);
      background: var(--app-primary-light);
    }
    .role-icon { font-size: 1.5rem; }
    .role-label { font-size: 0.8rem; font-weight: 700; color: var(--app-text); }
    .role-desc  { font-size: 0.68rem; color: var(--app-text-sub); text-align: center; line-height: 1.3; }

    /* 에러 박스 */
    .auth-error-box {
      background: var(--app-red-light);
      border: 1px solid #fecaca;
      border-radius: var(--r-sm);
      padding: 11px 14px;
      font-size: 0.85rem;
      color: var(--app-red);
      font-weight: 600;
      margin-bottom: 16px;
      display: none;
    }
    .auth-error-box.show { display: block; }

    /* 구분선 */
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: var(--app-text-muted);
      font-size: 0.8rem;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--app-border);
    }

    /* 하단 링크 */
    .auth-bottom {
      text-align: center;
      padding: 0 32px 24px;
      font-size: 0.83rem;
      color: var(--app-text-sub);
    }
    .auth-bottom a {
      color: var(--app-primary);
      font-weight: 700;
      cursor: pointer;
    }

    /* 데모 계정 박스 */
    .demo-box {
      margin: 0 32px 28px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: var(--r-md);
      padding: 14px 16px;
    }
    .demo-box-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--app-green-dark);
      margin-bottom: 8px;
    }
    .demo-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }
    .demo-info { font-size: 0.78rem; color: var(--app-text-sub); }
    .demo-fill-btn {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--app-green-dark);
      background: #dcfce7;
      border: none;
      border-radius: var(--r-full);
      padding: 3px 10px;
      cursor: pointer;
      font-family: inherit;
      transition: var(--tr);
    }
    .demo-fill-btn:hover { background: #bbf7d0; }

    @media (max-width: 480px) {
      .auth-panel { padding: 24px 20px 20px; }
      .auth-bottom { padding: 0 20px 20px; }
      .demo-box { margin: 0 20px 20px; }
      .role-group { grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    }

    /* ── 역할별 추가 폼 ── */
    .role-extra-section {
      background: var(--app-bg);
      border: 1.5px solid var(--app-border-mid);
      border-radius: var(--r-md);
      padding: 16px;
      margin-bottom: 18px;
    }
    .role-extra-title {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--app-text-sub);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .role-extra-section .app-field { margin-bottom: 12px; }
    .role-extra-section .app-field:last-child { margin-bottom: 0; }
    .role-extra-section .app-label { font-size: 0.8rem; }
    .role-extra-section .app-input,
    .role-extra-section .app-select { background: #fff; font-size: 0.88rem; padding: 10px 13px; }
    .vehicle-type-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .vtype-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 6px;
      border: 1.5px solid var(--app-border-mid);
      border-radius: var(--r-sm);
      background: #fff;
      cursor: pointer;
      font-family: inherit;
      transition: var(--tr);
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--app-text-sub);
    }
    .vtype-btn .vt-icon { font-size: 1.3rem; }
    .vtype-btn:hover { border-color: var(--app-primary); color: var(--app-primary); }
    .vtype-btn.selected { border-color: var(--app-primary); background: var(--app-primary-light); color: var(--app-primary-dark); }
    .price-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .service-check-group { display: flex; flex-direction: column; gap: 7px; }
    .service-check {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 11px;
      border: 1.5px solid var(--app-border-mid);
      border-radius: var(--r-sm);
      background: #fff;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--app-text-sub);
      transition: var(--tr);
    }
    .service-check input[type=checkbox] { accent-color: var(--app-primary); width: 15px; height: 15px; }
    .service-check:has(input:checked) { border-color: var(--app-primary); background: var(--app-primary-light); color: var(--app-primary-dark); }
    .addr-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: flex-start; }
    .addr-search-btn {
      padding: 10px 13px;
      background: var(--app-primary);
      color: #fff;
      border: none;
      border-radius: var(--r-sm);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: var(--tr);
    }
    .addr-search-btn:hover { background: var(--app-primary-dark); }
    .demo-row-multi { display: flex; flex-direction: column; gap: 6px; margin-bottom: 2px; }
  </style>
</head>
<body>

<div class="auth-header">
  <a href="../index.html" class="auth-logo">
    <div class="auth-logo-icon"><img src="../assets/images/hero-main.png" alt="제주모아" style="width:100%;height:100%;object-fit:cover;object-position:50% 38%;transform:scale(1.45);" /></div>
    <span class="auth-logo-text">제주<span>모아</span></span>
  </a>
</div>

<div class="auth-wrap">
  <div class="auth-card">
    <!-- 탭 -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">로그인</button>
      <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">회원가입</button>
    </div>

    <!-- 로그인 패널 -->
    <div class="auth-panel active" id="panelLogin">
      <div class="auth-panel-title">다시 만나서 반가워요 👋</div>
      <div class="auth-panel-sub">이메일과 비밀번호로 로그인하세요.</div>

      <div class="auth-error-box" id="loginError"></div>

      <div class="app-field">
        <label class="app-label">이메일</label>
        <input class="app-input" type="email" id="loginEmail" placeholder="email@example.com" autocomplete="email" />
      </div>
      <div class="app-field">
        <label class="app-label">비밀번호</label>
        <input class="app-input" type="password" id="loginPw" placeholder="비밀번호 입력" autocomplete="current-password" />
      </div>

      <button class="app-btn app-btn-primary app-btn-full app-btn-lg" id="loginBtn" onclick="doLogin()">
        로그인
      </button>
    </div>

    <!-- 회원가입 패널 -->
    <div class="auth-panel" id="panelRegister">
      <div class="auth-panel-title">제주모아에 오신 걸 환영합니다 🍊</div>
      <div class="auth-panel-sub">회원 유형을 선택하고 가입하세요.</div>

      <div class="auth-error-box" id="regError"></div>

      <!-- 역할 선택 -->
      <div class="role-group">
        <button class="role-btn selected" data-role="farmer" onclick="selectRole(this)">
          <span class="role-icon">👨‍🌾</span>
          <span class="role-label">농업인</span>
          <span class="role-desc">농가 등록·출하 관리</span>
        </button>
        <button class="role-btn" data-role="logistics" onclick="selectRole(this)">
          <span class="role-icon">🚚</span>
          <span class="role-label">물류업체</span>
          <span class="role-desc">배차·경로 관리</span>
        </button>
        <button class="role-btn" data-role="consumer" onclick="selectRole(this)">
          <span class="role-icon">🛒</span>
          <span class="role-label">소비자</span>
          <span class="role-desc">농산물 정보 조회</span>
        </button>
      </div>

      <div class="app-field">
        <label class="app-label">이름 <span class="req">*</span></label>
        <input class="app-input" type="text" id="regName" placeholder="홍길동" />
      </div>
      <div class="app-field">
        <label class="app-label">이메일 <span class="req">*</span></label>
        <input class="app-input" type="email" id="regEmail" placeholder="email@example.com" />
      </div>
      <div class="app-field">
        <label class="app-label">비밀번호 <span class="req">*</span></label>
        <input class="app-input" type="password" id="regPw" placeholder="6자 이상" />
        <div class="app-input-hint">영문, 숫자 조합 6자 이상</div>
      </div>
      <div class="app-field">
        <label class="app-label">비밀번호 확인 <span class="req">*</span></label>
        <input class="app-input" type="password" id="regPw2" placeholder="비밀번호 재입력" />
      </div>

      <!-- ── 역할별 추가 입력 (동적) ── -->
      <div id="roleExtraFields"></div>

      <button class="app-btn app-btn-primary app-btn-full app-btn-lg" onclick="doRegister()">
        가입하기
      </button>
    </div>

    <!-- 데모 계정 안내 -->
    <div class="demo-box" id="demoBox">
      <div class="demo-box-title">🧪 데모 계정으로 빠르게 체험</div>
      <div class="demo-row-multi">
        <div class="demo-row">
          <span class="demo-info">👨‍🌾 farmer@jeju.com / demo1234</span>
          <button class="demo-fill-btn" onclick="fillDemo('farmer@jeju.com','demo1234')">농업인</button>
        </div>
        <div class="demo-row">
          <span class="demo-info">🚚 logistics@jeju.com / demo1234</span>
          <button class="demo-fill-btn" onclick="fillDemo('logistics@jeju.com','demo1234')">물류업체</button>
        </div>
        <div class="demo-row">
          <span class="demo-info">🛒 consumer@jeju.com / demo1234</span>
          <button class="demo-fill-btn" onclick="fillDemo('consumer@jeju.com','demo1234')">소비자</button>
        </div>
      </div>
    </div>

    <div class="auth-bottom">
      <span id="authBottomText">계정이 없으신가요? </span>
      <a id="authBottomLink" onclick="switchTab('register')">회원가입</a>
    </div>
  </div>
</div>

<script src="../js/auth.js"></script>
<script>
  if (JMAuth.isLoggedIn()) location.href = '../index.html';

  /* 데모 계정 생성 */
  (function createDemos() {
    var demos = [
      { name: '김제주',  email: 'farmer@jeju.com',    pw: 'demo1234', role: 'farmer' },
      { name: '제주운송', email: 'logistics@jeju.com', pw: 'demo1234', role: 'logistics' },
      { name: '제주소비', email: 'consumer@jeju.com',  pw: 'demo1234', role: 'consumer' }
    ];
    demos.forEach(function(d) {
      var users = JSON.parse(localStorage.getItem('jmoa_users') || '[]');
      if (!users.find(function(u){ return u.email === d.email; })) {
        JMAuth.register(d.name, d.email, d.pw, d.role);
        localStorage.removeItem('jmoa_session');
      }
    });
  })();

  var currentRole = 'farmer';
  var selectedVehicleTypes = [];

  /* ── 역할별 추가 폼 정의 ── */
  var ROLE_EXTRA = {
    farmer: '',   /* 농업인은 기존 폼으로 충분 */
    logistics: `
      <div class="role-extra-section">
        <div class="role-extra-title">🚚 물류업체 정보</div>
        <div class="app-field">
          <label class="app-label">업체명 <span class="req">*</span></label>
          <input class="app-input" type="text" id="lgCompany" placeholder="예: 제주특급물류" />
        </div>
        <div class="app-field">
          <label class="app-label">사업자등록번호</label>
          <input class="app-input" type="text" id="lgBizNum" placeholder="000-00-00000" />
        </div>
        <div class="app-field">
          <label class="app-label">대표 기사 이름 <span class="req">*</span></label>
          <input class="app-input" type="text" id="lgDriver" placeholder="예: 홍길동" />
        </div>
        <div class="app-field">
          <label class="app-label">연락처 <span class="req">*</span></label>
          <input class="app-input" type="tel" id="lgPhone" placeholder="010-0000-0000" />
        </div>
      </div>
      <div class="role-extra-section">
        <div class="role-extra-title">🚛 보유 차량 종류 (복수 선택)</div>
        <div class="vehicle-type-grid" id="vtypeGrid">
          <button class="vtype-btn" data-vtype="1ton"   onclick="toggleVtype(this)"><span class="vt-icon">🚐</span>1톤 트럭</button>
          <button class="vtype-btn" data-vtype="2.5ton" onclick="toggleVtype(this)"><span class="vt-icon">🚚</span>2.5톤 트럭</button>
          <button class="vtype-btn" data-vtype="5ton"   onclick="toggleVtype(this)"><span class="vt-icon">🚛</span>5톤 트럭</button>
          <button class="vtype-btn" data-vtype="11ton"  onclick="toggleVtype(this)"><span class="vt-icon">🚜</span>11톤 트럭</button>
          <button class="vtype-btn" data-vtype="freeze" onclick="toggleVtype(this)"><span class="vt-icon">❄️</span>냉동차</button>
          <button class="vtype-btn" data-vtype="wing"   onclick="toggleVtype(this)"><span class="vt-icon">📦</span>윙바디</button>
        </div>
      </div>
      <div class="role-extra-section">
        <div class="role-extra-title">💰 운임 기준 설정</div>
        <div class="price-row">
          <div class="app-field">
            <label class="app-label">기본 운임 (원/km)</label>
            <input class="app-input" type="number" id="lgPriceKm" placeholder="예: 800" min="0" />
          </div>
          <div class="app-field">
            <label class="app-label">최소 운임 (원)</label>
            <input class="app-input" type="number" id="lgPriceMin" placeholder="예: 50000" min="0" />
          </div>
        </div>
        <div class="app-field">
          <label class="app-label">운행 권역</label>
          <select class="app-select" id="lgZone">
            <option value="jeju">제주도 내</option>
            <option value="nationwide">전국</option>
            <option value="jeju-inland">제주 → 내륙</option>
          </select>
        </div>
      </div>
      <div class="role-extra-section">
        <div class="role-extra-title">⭐ 부가 서비스</div>
        <div class="service-check-group">
          <label class="service-check"><input type="checkbox" value="refrigerated" /> ❄️ 냉장·냉동 운반 가능</label>
          <label class="service-check"><input type="checkbox" value="loading" /> 💪 상하차 인력 지원</label>
          <label class="service-check"><input type="checkbox" value="packaging" /> 📦 포장재 제공</label>
          <label class="service-check"><input type="checkbox" value="tracking" /> 📍 실시간 GPS 추적</label>
          <label class="service-check"><input type="checkbox" value="insurance" /> 🛡️ 화물 보험 가입</label>
        </div>
      </div>`,
    consumer: `
      <div class="role-extra-section">
        <div class="role-extra-title">🏠 배송지 정보</div>
        <div class="app-field">
          <label class="app-label">기본 배송지 <span class="req">*</span></label>
          <div class="addr-row">
            <input class="app-input" type="text" id="csAddr" placeholder="주소 검색" readonly
              onclick="searchAddr()" style="cursor:pointer;" />
            <button class="addr-search-btn" onclick="searchAddr()">🔍 검색</button>
          </div>
          <input class="app-input" type="text" id="csAddrDetail" placeholder="상세주소 (동·호수)"
            style="margin-top:7px;" />
        </div>
        <div class="app-field">
          <label class="app-label">연락처</label>
          <input class="app-input" type="tel" id="csPhone" placeholder="010-0000-0000" />
        </div>
      </div>
      <div class="role-extra-section">
        <div class="role-extra-title">🛒 쇼핑 설정</div>
        <div class="app-field">
          <label class="app-label">선호 농산물</label>
          <div class="vehicle-type-grid" id="cropPrefGrid">
            <button class="vtype-btn" data-crop="citrus"  onclick="toggleCrop(this)"><span class="vt-icon">🍊</span>감귤류</button>
            <button class="vtype-btn" data-crop="veg"     onclick="toggleCrop(this)"><span class="vt-icon">🥦</span>채소류</button>
            <button class="vtype-btn" data-crop="root"    onclick="toggleCrop(this)"><span class="vt-icon">🥕</span>뿌리채소</button>
            <button class="vtype-btn" data-crop="organic" onclick="toggleCrop(this)"><span class="vt-icon">🌿</span>유기농만</button>
          </div>
        </div>
        <div class="app-field">
          <label class="app-label">알림 수신</label>
          <div class="service-check-group">
            <label class="service-check"><input type="checkbox" value="new" checked /> 🆕 신상품 알림</label>
            <label class="service-check"><input type="checkbox" value="sale" checked /> 🏷️ 할인·특가 알림</label>
            <label class="service-check"><input type="checkbox" value="ship" checked /> 🚚 배송 현황 알림</label>
          </div>
        </div>
      </div>`
  };

  function toggleVtype(btn) {
    btn.classList.toggle('selected');
    var t = btn.dataset.vtype;
    var idx = selectedVehicleTypes.indexOf(t);
    if (idx > -1) selectedVehicleTypes.splice(idx, 1);
    else selectedVehicleTypes.push(t);
  }

  var selectedCrops = [];
  function toggleCrop(btn) {
    btn.classList.toggle('selected');
    var c = btn.dataset.crop;
    var idx = selectedCrops.indexOf(c);
    if (idx > -1) selectedCrops.splice(idx, 1);
    else selectedCrops.push(c);
  }

  function searchAddr() {
    /* 실제 서비스에서는 카카오 주소 API 연동 */
    var sample = ['서울시 강남구 테헤란로 123', '부산시 해운대구 센텀로 55',
                  '제주시 노형로 100', '서귀포시 중앙로 22', '인천시 연수구 송도대로 1'];
    var picked = sample[Math.floor(Math.random() * sample.length)];
    var el = document.getElementById('csAddr');
    if (el) { el.value = picked; el.style.cursor = 'default'; }
    alert('✅ 주소 선택: ' + picked + '\n\n(실제 서비스에서는 카카오 우편번호 API가 연동됩니다)');
  }

  /* ── 탭 전환 ── */
  function switchTab(tab) {
    var isLogin = tab === 'login';
    document.getElementById('tabLogin').classList.toggle('active', isLogin);
    document.getElementById('tabRegister').classList.toggle('active', !isLogin);
    document.getElementById('panelLogin').classList.toggle('active', isLogin);
    document.getElementById('panelRegister').classList.toggle('active', !isLogin);
    document.getElementById('demoBox').style.display = isLogin ? '' : 'none';
    document.getElementById('authBottomText').textContent = isLogin ? '계정이 없으신가요? ' : '이미 계정이 있으신가요? ';
    document.getElementById('authBottomLink').textContent = isLogin ? '회원가입' : '로그인';
    document.getElementById('authBottomLink').onclick = function() { switchTab(isLogin ? 'register' : 'login'); };
  }

  /* ── 역할 선택 ── */
  function selectRole(btn) {
    document.querySelectorAll('.role-btn').forEach(function(b){ b.classList.remove('selected'); });
    btn.classList.add('selected');
    currentRole = btn.dataset.role;
    selectedVehicleTypes = [];
    selectedCrops = [];

    var extra = document.getElementById('roleExtraFields');
    if (extra) extra.innerHTML = ROLE_EXTRA[currentRole] || '';
  }

  function fillDemo(email, pw) {
    document.getElementById('loginEmail').value = email;
    document.getElementById('loginPw').value = pw;
  }

  function showError(id, msg) {
    var el = document.getElementById(id);
    el.textContent = msg; el.classList.add('show');
  }
  function hideError(id) {
    var el = document.getElementById(id);
    el.textContent = ''; el.classList.remove('show');
  }

  /* ── 로그인 ── */
  function doLogin() {
    hideError('loginError');
    var email = document.getElementById('loginEmail').value.trim();
    var pw    = document.getElementById('loginPw').value;
    var btn   = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = '로그인 중...';
    setTimeout(function() {
      var res = JMAuth.login(email, pw);
      if (res.ok) {
        location.href = '../index.html';
      } else {
        showError('loginError', res.error);
        btn.disabled = false; btn.textContent = '로그인';
      }
    }, 600);
  }

  /* ── 회원가입 ── */
  function doRegister() {
    hideError('regError');
    var name  = document.getElementById('regName').value.trim();
    var email = document.getElementById('regEmail').value.trim();
    var pw    = document.getElementById('regPw').value;
    var pw2   = document.getElementById('regPw2').value;

    if (pw !== pw2) { showError('regError', '비밀번호가 일치하지 않습니다.'); return; }

    /* 역할별 필수 검증 */
    if (currentRole === 'logistics') {
      var co = document.getElementById('lgCompany');
      var dr = document.getElementById('lgDriver');
      var ph = document.getElementById('lgPhone');
      if (co && !co.value.trim()) { showError('regError', '업체명을 입력해주세요.'); return; }
      if (dr && !dr.value.trim()) { showError('regError', '대표 기사 이름을 입력해주세요.'); return; }
      if (ph && !ph.value.trim()) { showError('regError', '연락처를 입력해주세요.'); return; }
    }
    if (currentRole === 'consumer') {
      var addr = document.getElementById('csAddr');
      if (addr && !addr.value.trim()) { showError('regError', '기본 배송지를 입력해주세요.'); return; }
    }

    var res = JMAuth.register(name, email, pw, currentRole);
    if (!res.ok) { showError('regError', res.error); return; }

    /* 역할별 추가 정보 저장 */
    var uid = res.user.id;
    if (currentRole === 'logistics') {
      var lgData = {
        company:       (document.getElementById('lgCompany') || {}).value || '',
        bizNum:        (document.getElementById('lgBizNum')  || {}).value || '',
        driverName:    (document.getElementById('lgDriver')  || {}).value || '',
        phone:         (document.getElementById('lgPhone')   || {}).value || '',
        vehicleTypes:  selectedVehicleTypes.slice(),
        pricePerKm:    (document.getElementById('lgPriceKm') || {}).value || '',
        minPrice:      (document.getElementById('lgPriceMin')|| {}).value || '',
        zone:          (document.getElementById('lgZone')    || {}).value || 'jeju',
        services:      Array.from(document.querySelectorAll('.service-check input:checked')).map(function(i){ return i.value; }),
        earnings:      0,
        totalTrips:    0,
        rating:        5.0
      };
      localStorage.setItem('jmoa_logistics_' + uid, JSON.stringify(lgData));
    }
    if (currentRole === 'consumer') {
      var csData = {
        address:     (document.getElementById('csAddr')      || {}).value || '',
        addrDetail:  (document.getElementById('csAddrDetail')|| {}).value || '',
        phone:       (document.getElementById('csPhone')     || {}).value || '',
        cropPrefs:   selectedCrops.slice(),
        notifications: Array.from(document.querySelectorAll('.service-check input:checked')).map(function(i){ return i.value; }),
        cart:        [],
        orders:      []
      };
      localStorage.setItem('jmoa_consumer_' + uid, JSON.stringify(csData));
    }

    location.href = '../index.html';
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      if (document.getElementById('panelLogin').classList.contains('active')) doLogin();
      else doRegister();
    }
  });
</script>
</body>
</html>
