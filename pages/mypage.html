<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마이페이지 | 제주모아</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <style>
    .my-layout { display: grid; grid-template-columns: 280px 1fr; gap: 20px; align-items: start; }
    /* 프로필 카드 */
    .profile-card {
      background: var(--app-surface);
      border: 1px solid var(--app-border);
      border-radius: var(--r-lg);
      padding: 28px 22px;
      text-align: center;
      box-shadow: var(--shadow-xs);
      position: sticky;
      top: calc(var(--header-h) + 20px);
    }
    .profile-avatar {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: var(--app-primary);
      color: #fff;
      font-size: 1.8rem;
      font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px;
    }
    .profile-name { font-size: 1.15rem; font-weight: 800; color: var(--app-text); margin-bottom: 4px; }
    .profile-email { font-size: 0.82rem; color: var(--app-text-sub); margin-bottom: 12px; }
    .profile-nav { display: flex; flex-direction: column; gap: 4px; margin-top: 20px; text-align: left; }
    .profile-nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      border-radius: var(--r-sm);
      font-size: 0.88rem; font-weight: 600; color: var(--app-text-sub);
      cursor: pointer; transition: var(--tr); border: none; background: transparent;
      font-family: inherit; width: 100%; text-align: left;
    }
    .profile-nav-item:hover { background: var(--app-bg); color: var(--app-text); }
    .profile-nav-item.active { background: var(--app-primary-light); color: var(--app-primary-dark); }
    /* 탭 콘텐츠 */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    /* 정보 테이블 */
    .info-table { width: 100%; border-collapse: collapse; }
    .info-table tr { border-bottom: 1px solid var(--app-border); }
    .info-table tr:last-child { border-bottom: none; }
    .info-table th {
      width: 140px; padding: 13px 0; text-align: left;
      font-size: 0.84rem; font-weight: 700; color: var(--app-text-sub);
    }
    .info-table td {
      padding: 13px 0; font-size: 0.9rem; font-weight: 600; color: var(--app-text);
    }
    /* 출하 예약 테이블 */
    .ship-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    .ship-table th {
      padding: 10px 12px; background: var(--app-bg);
      font-size: 0.78rem; font-weight: 700; color: var(--app-text-sub);
      text-align: left; border-bottom: 1px solid var(--app-border);
    }
    .ship-table td { padding: 12px 12px; border-bottom: 1px solid var(--app-border); color: var(--app-text); }
    .ship-table tr:last-child td { border-bottom: none; }
    /* 출하예약 등록 폼 */
    .ship-form-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    /* 비밀번호 변경 */
    .pw-form { max-width: 420px; }
    @media (max-width: 800px) {
      .my-layout { grid-template-columns: 1fr; }
      .profile-card { position: static; }
      .profile-nav { flex-direction: row; flex-wrap: wrap; }
      .ship-form-row { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
      .ship-form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header class="app-header" id="appHeader">
  <div class="app-header-inner">
    <a href="../index.html" class="app-logo">
      <div class="app-logo-icon"><img src="../assets/images/hero-main.png" alt="제주모아" /></div>
      <span class="app-logo-text">제주<span>모아</span></span>
    </a>
    <nav class="app-nav">
      <a href="../index.html" class="app-nav-link">홈</a>
      <a href="farm-register.html" class="app-nav-link">농가 등록</a>
      <a href="mypage.html" class="app-nav-link active">마이페이지</a>
    </nav>
    <div class="app-header-user">
      <div class="app-user-chip">
        <div class="app-user-avatar" id="userAvatar">?</div>
        <div class="app-user-info">
          <span class="app-user-name" data-user-name>-</span>
          <span class="app-user-role" data-user-role>-</span>
        </div>
      </div>
      <button class="app-logout-btn" data-logout-btn>로그아웃</button>
    </div>
  </div>
</header>

<div class="app-page-bar">
  <div class="app-container">
    <div class="app-page-bar-inner">
      <div class="app-page-bar-left">
        <span class="app-page-tag">👤 계정</span>
        <h1 class="app-page-title">마이페이지</h1>
      </div>
    </div>
  </div>
</div>

<main class="app-main">
  <div class="app-container">
    <div class="my-layout">

      <!-- 프로필 사이드 -->
      <div class="profile-card">
        <div class="profile-avatar" id="bigAvatar">?</div>
        <div class="profile-name" data-user-name>-</div>
        <div class="profile-email" data-user-email>-</div>
        <span class="app-badge app-badge-blue" data-user-role>-</span>
        <div class="profile-nav">
          <button class="profile-nav-item active" onclick="showTab('farm')">🌾 농가 정보</button>
          <button class="profile-nav-item" onclick="showTab('shipment')">📦 출하 예약</button>
          <button class="profile-nav-item" onclick="showTab('activity')">📋 활동 내역</button>
          <button class="profile-nav-item" onclick="showTab('account')">⚙️ 계정 설정</button>
        </div>
      </div>

      <!-- 오른쪽 콘텐츠 -->
      <div>

        <!-- 농가 정보 탭 -->
        <div class="tab-panel active app-card" id="tabFarm">
          <div class="app-card-title"><span>🌾</span> 등록 농가 정보
            <div style="margin-left:auto;">
              <a href="farm-register.html" class="app-btn app-btn-ghost app-btn-sm">✏️ 수정하기</a>
            </div>
          </div>
          <div id="farmInfoBody">
            <div class="app-empty">
              <div class="app-empty-icon">🌱</div>
              <div class="app-empty-msg">등록된 농가 정보가 없습니다.</div>
              <div style="margin-top:14px;">
                <a href="farm-register.html" class="app-btn app-btn-primary app-btn-sm">농가 정보 등록하기</a>
              </div>
            </div>
          </div>
        </div>

        <!-- 출하 예약 탭 -->
        <div class="tab-panel app-card" id="tabShipment">
          <div class="app-card-title"><span>📦</span> 출하 예약 관리</div>

          <!-- 신규 예약 폼 -->
          <div style="background:var(--app-bg);border-radius:var(--r-md);padding:18px;margin-bottom:20px;">
            <div style="font-size:0.85rem;font-weight:800;color:var(--app-text-sub);margin-bottom:14px;">+ 새 출하 예약 등록</div>
            <div class="ship-form-row">
              <div class="app-field" style="margin-bottom:0;">
                <label class="app-label">출하 예정일 <span class="req">*</span></label>
                <input class="app-input" type="date" id="shipDate" />
              </div>
              <div class="app-field" style="margin-bottom:0;">
                <label class="app-label">출하량 (kg) <span class="req">*</span></label>
                <input class="app-input" type="number" id="shipAmount" placeholder="예: 1200" min="1" />
              </div>
              <div class="app-field" style="margin-bottom:0;">
                <label class="app-label">목적지</label>
                <input class="app-input" type="text" id="shipDest" placeholder="예: 가락시장" />
              </div>
            </div>
            <div style="margin-top:12px;">
              <button class="app-btn app-btn-primary app-btn-sm" onclick="addShipment()">예약 등록</button>
            </div>
          </div>

          <!-- 예약 목록 -->
          <div id="shipmentListWrap">
            <div class="app-empty" id="shipmentEmpty">
              <div class="app-empty-icon">📭</div>
              <div class="app-empty-msg">등록된 출하 예약이 없습니다.</div>
            </div>
            <table class="ship-table" id="shipmentTable" style="display:none;">
              <thead>
                <tr>
                  <th>출하 예정일</th>
                  <th>출하량</th>
                  <th>목적지</th>
                  <th>상태</th>
                  <th>등록일</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="shipmentTbody"></tbody>
            </table>
          </div>
        </div>

        <!-- 활동 내역 탭 -->
        <div class="tab-panel app-card" id="tabActivity">
          <div class="app-card-title"><span>📋</span> 활동 내역</div>
          <div id="activityBody">
            <div class="app-empty">
              <div class="app-empty-icon">📭</div>
              <div class="app-empty-msg">활동 내역이 없습니다.</div>
            </div>
          </div>
        </div>

        <!-- 계정 설정 탭 -->
        <div class="tab-panel app-card" id="tabAccount">
          <div class="app-card-title"><span>⚙️</span> 계정 설정</div>

          <div style="margin-bottom:24px;">
            <div style="font-size:0.85rem;font-weight:800;color:var(--app-text-sub);margin-bottom:14px;">기본 정보 수정</div>
            <div class="app-field">
              <label class="app-label">이름</label>
              <input class="app-input" type="text" id="editName" />
            </div>
            <div class="app-field">
              <label class="app-label">이메일</label>
              <input class="app-input" type="email" id="editEmail" disabled style="opacity:.6;" />
              <div class="app-input-hint">이메일은 변경할 수 없습니다.</div>
            </div>
            <button class="app-btn app-btn-primary app-btn-sm" onclick="saveAccount()">저장</button>
          </div>

          <hr class="app-divider" />

          <div class="pw-form">
            <div style="font-size:0.85rem;font-weight:800;color:var(--app-text-sub);margin-bottom:14px;">비밀번호 변경</div>
            <div class="app-field">
              <label class="app-label">현재 비밀번호</label>
              <input class="app-input" type="password" id="pwCurrent" placeholder="현재 비밀번호" />
            </div>
            <div class="app-field">
              <label class="app-label">새 비밀번호</label>
              <input class="app-input" type="password" id="pwNew" placeholder="6자 이상" />
            </div>
            <div class="app-field">
              <label class="app-label">새 비밀번호 확인</label>
              <input class="app-input" type="password" id="pwNew2" placeholder="재입력" />
            </div>
            <div class="auth-error-box" id="pwError" style="background:var(--app-red-light);border:1px solid #fecaca;border-radius:var(--r-sm);padding:11px 14px;font-size:0.85rem;color:var(--app-red);font-weight:600;margin-bottom:12px;display:none;"></div>
            <button class="app-btn app-btn-ghost app-btn-sm" onclick="changePw()">비밀번호 변경</button>
          </div>
        </div>

      </div>
    </div>
  </div>
</main>

<div class="app-toast-wrap" id="toastWrap"></div>

<script src="../js/auth.js"></script>
<script>
  JMAuth.requireLogin();
  JMAuth.injectUserUI();

  var user = JMAuth.currentUser();
  if (user) {
    var ini = (user.name || '?')[0];
    document.getElementById('userAvatar').textContent = ini;
    document.getElementById('bigAvatar').textContent  = ini;
  }

  window.addEventListener('scroll', function() {
    document.getElementById('appHeader').classList.toggle('scrolled', window.scrollY > 10);
  }, { passive: true });

  var FARM_KEY     = user ? 'jmoa_farm_'     + user.id : null;
  var SHIP_KEY     = user ? 'jmoa_shipments_' + user.id : null;
  var ACTIVITY_KEY = user ? 'jmoa_activity_' + user.id : null;

  /* ── 탭 전환 ── */
  function showTab(name) {
    ['farm','shipment','activity','account'].forEach(function(t) {
      document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.toggle('active', t === name);
    });
    document.querySelectorAll('.profile-nav-item').forEach(function(btn, i) {
      btn.classList.toggle('active', i === ['farm','shipment','activity','account'].indexOf(name));
    });
    if (name === 'farm')     loadFarm();
    if (name === 'shipment') loadShipments();
    if (name === 'activity') loadActivity();
    if (name === 'account')  loadAccount();
  }

  /* ── 농가 정보 ── */
  function loadFarm() {
    var farm = JSON.parse(localStorage.getItem(FARM_KEY) || 'null');
    var body = document.getElementById('farmInfoBody');
    if (!farm) {
      body.innerHTML = '<div class="app-empty"><div class="app-empty-icon">🌱</div><div class="app-empty-msg">등록된 농가 정보가 없습니다.</div><div style="margin-top:14px;"><a href="farm-register.html" class="app-btn app-btn-primary app-btn-sm">농가 정보 등록하기</a></div></div>';
      return;
    }
    var rows = [
      ['농가명', farm.farmName], ['지역', farm.region], ['작물', farm.cropType],
      ['재배면적', (farm.area || '-') + ' ㎡'], ['식재수량', (farm.treeCount || '-') + ' 그루'],
      ['나무 수령', (farm.treeAge || '-') + ' 년'], ['품종', farm.variety || '-'],
      ['예상 출하 시기', farm.expectedDate || '-'],
      ['예상 출하량', farm.estimatedAmount ? Number(farm.estimatedAmount).toLocaleString() + ' kg' : '-'],
      ['목적지', farm.destination || '-'],
      ['친환경 인증', farm.organic ? '✅ ' + (farm.certType || '인증 있음') : '❌ 일반'],
      ['인증번호', farm.certNumber || '-'],
      ['특이사항', farm.memo || '-'],
      ['최종 수정', farm.updatedAt || '-']
    ];
    body.innerHTML = '<table class="info-table">'
      + rows.map(function(r) {
          return '<tr><th>' + r[0] + '</th><td>' + (r[1] || '-') + '</td></tr>';
        }).join('')
      + '</table>';
  }

  /* ── 출하 예약 ── */
  function loadShipments() {
    var list = JSON.parse(localStorage.getItem(SHIP_KEY) || '[]');
    var empty = document.getElementById('shipmentEmpty');
    var table = document.getElementById('shipmentTable');
    var tbody = document.getElementById('shipmentTbody');
    if (!list.length) { empty.style.display = ''; table.style.display = 'none'; return; }
    empty.style.display = 'none'; table.style.display = '';
    tbody.innerHTML = list.map(function(s, i) {
      var statusMap = { pending: ['대기', 'gray'], matched: ['매칭완료', 'green'], done: ['출하완료', 'blue'] };
      var st = statusMap[s.status] || ['대기', 'gray'];
      return '<tr>'
        + '<td><strong>' + s.date + '</strong></td>'
        + '<td>' + Number(s.amount).toLocaleString() + ' kg</td>'
        + '<td>' + (s.dest || '-') + '</td>'
        + '<td><span class="app-badge app-badge-' + st[1] + '">' + st[0] + '</span></td>'
        + '<td style="color:var(--app-text-sub);font-size:0.78rem;">' + s.createdAt + '</td>'
        + '<td><button class="app-btn app-btn-secondary app-btn-sm" onclick="deleteShipment(' + i + ')">삭제</button></td>'
        + '</tr>';
    }).join('');
  }

  function addShipment() {
    var date   = document.getElementById('shipDate').value;
    var amount = document.getElementById('shipAmount').value;
    var dest   = document.getElementById('shipDest').value.trim();
    if (!date || !amount) { showToast('날짜와 출하량을 입력해주세요.', 'error'); return; }

    var list = JSON.parse(localStorage.getItem(SHIP_KEY) || '[]');
    list.unshift({ date: date, amount: amount, dest: dest, status: 'pending',
                   createdAt: new Date().toLocaleDateString('ko-KR') });
    localStorage.setItem(SHIP_KEY, JSON.stringify(list));

    addActivityLog({ icon:'📦', colorClass:'ic-orange', title:'출하 예약 등록',
                     sub: date + ' · ' + Number(amount).toLocaleString() + 'kg', time: now() });
    document.getElementById('shipDate').value = '';
    document.getElementById('shipAmount').value = '';
    document.getElementById('shipDest').value = '';
    loadShipments();
    showToast('출하 예약이 등록되었습니다.', 'success');
  }

  function deleteShipment(i) {
    var list = JSON.parse(localStorage.getItem(SHIP_KEY) || '[]');
    list.splice(i, 1);
    localStorage.setItem(SHIP_KEY, JSON.stringify(list));
    loadShipments();
    showToast('삭제되었습니다.');
  }

  /* ── 활동 내역 ── */
  function loadActivity() {
    var list = JSON.parse(localStorage.getItem(ACTIVITY_KEY) || '[]');
    var body = document.getElementById('activityBody');
    if (!list.length) { body.innerHTML = '<div class="app-empty"><div class="app-empty-icon">📭</div><div class="app-empty-msg">활동 내역이 없습니다.</div></div>'; return; }
    body.innerHTML = list.map(function(a) {
      return '<div style="display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--app-border);">'
        + '<div style="width:36px;height:36px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:1rem;" class="' + (a.colorClass||'ic-gray') + '">' + (a.icon||'📌') + '</div>'
        + '<div style="flex:1;"><div style="font-size:0.88rem;font-weight:700;">' + a.title + '</div><div style="font-size:0.76rem;color:var(--app-text-sub);">' + (a.sub||'') + '</div></div>'
        + '<div style="font-size:0.75rem;color:var(--app-text-muted);">' + a.time + '</div>'
        + '</div>';
    }).join('');
  }

  /* ── 계정 설정 ── */
  function loadAccount() {
    document.getElementById('editName').value  = user.name  || '';
    document.getElementById('editEmail').value = user.email || '';
  }

  function saveAccount() {
    var name = document.getElementById('editName').value.trim();
    if (!name) { showToast('이름을 입력해주세요.', 'error'); return; }
    var users = JSON.parse(localStorage.getItem('jmoa_users') || '[]');
    var idx = users.findIndex(function(u){ return u.id === user.id; });
    if (idx >= 0) { users[idx].name = name; localStorage.setItem('jmoa_users', JSON.stringify(users)); }
    var session = JSON.parse(localStorage.getItem('jmoa_session') || '{}');
    session.name = name;
    localStorage.setItem('jmoa_session', JSON.stringify(session));
    showToast('이름이 변경되었습니다.', 'success');
    setTimeout(function(){ location.reload(); }, 1000);
  }

  function changePw() {
    var errEl = document.getElementById('pwError');
    errEl.style.display = 'none';
    var cur  = document.getElementById('pwCurrent').value;
    var nw   = document.getElementById('pwNew').value;
    var nw2  = document.getElementById('pwNew2').value;
    if (!cur||!nw||!nw2) { errEl.textContent='모두 입력해주세요.'; errEl.style.display=''; return; }
    if (nw !== nw2) { errEl.textContent='새 비밀번호가 일치하지 않습니다.'; errEl.style.display=''; return; }
    if (nw.length < 6) { errEl.textContent='비밀번호는 6자 이상이어야 합니다.'; errEl.style.display=''; return; }
    var users = JSON.parse(localStorage.getItem('jmoa_users') || '[]');
    var idx = users.findIndex(function(u){ return u.id === user.id; });
    if (idx < 0 || users[idx].password !== cur) { errEl.textContent='현재 비밀번호가 올바르지 않습니다.'; errEl.style.display=''; return; }
    users[idx].password = nw;
    localStorage.setItem('jmoa_users', JSON.stringify(users));
    document.getElementById('pwCurrent').value = '';
    document.getElementById('pwNew').value = '';
    document.getElementById('pwNew2').value = '';
    showToast('비밀번호가 변경되었습니다.', 'success');
  }

  function addActivityLog(item) {
    var list = JSON.parse(localStorage.getItem(ACTIVITY_KEY) || '[]');
    list.unshift(item);
    if (list.length > 20) list = list.slice(0, 20);
    localStorage.setItem(ACTIVITY_KEY, JSON.stringify(list));
  }

  function now() {
    return new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  }

  function showToast(msg, type) {
    var wrap = document.getElementById('toastWrap');
    var t = document.createElement('div');
    t.className = 'app-toast' + (type ? ' ' + type : '');
    t.textContent = msg;
    wrap.appendChild(t);
    requestAnimationFrame(function(){ t.classList.add('show'); });
    setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ t.remove(); },300); }, 2800);
  }

  /* 초기 로드 */
  loadFarm();
</script>
</body>
</html>
