<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>제주 농산물 쇼핑 | 제주모아</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <style>
    /* ── 레이아웃 ── */
    .shop-layout { display: grid; grid-template-columns: 220px 1fr; gap: 20px; align-items: start; }
    /* ── 사이드 필터 ── */
    .filter-side { position: sticky; top: calc(var(--header-h) + 20px); }
    .filter-group { margin-bottom: 20px; }
    .filter-group-title { font-size: 0.78rem; font-weight: 800; color: var(--app-text-sub); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 10px; }
    .filter-check { display: flex; align-items: center; gap: 9px; padding: 7px 0; font-size: 0.86rem; font-weight: 600; color: var(--app-text-sub); cursor: pointer; }
    .filter-check input { accent-color: var(--app-primary); width: 15px; height: 15px; }
    .filter-check:has(input:checked) { color: var(--app-primary-dark); }
    .price-range { display: flex; flex-direction: column; gap: 8px; }
    .price-range input[type=range] { width: 100%; accent-color: var(--app-primary); }
    .price-range-label { font-size: 0.8rem; color: var(--app-text-sub); font-weight: 600; }
    /* ── 상품 그리드 ── */
    .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .product-card { background: var(--app-surface); border: 1px solid var(--app-border); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-xs); transition: var(--tr); cursor: pointer; }
    .product-card:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); }
    .product-img { height: 130px; display: flex; align-items: center; justify-content: center; font-size: 3.8rem; position: relative; }
    .product-img.citrus { background: linear-gradient(135deg, #fff7ed, #fef3c7); }
    .product-img.veg    { background: linear-gradient(135deg, #f0fdf4, #dcfce7); }
    .product-img.root   { background: linear-gradient(135deg, #fef9ee, #fde68a44); }
    .cert-badge { position: absolute; top: 8px; right: 8px; background: #166534; color: #fff; font-size: 0.65rem; font-weight: 800; padding: 2px 7px; border-radius: var(--r-full); }
    .product-body { padding: 14px; }
    .product-name { font-size: 0.95rem; font-weight: 800; color: var(--app-text); margin-bottom: 3px; }
    .product-farm { font-size: 0.75rem; color: var(--app-text-sub); margin-bottom: 10px; }
    .product-price { font-size: 1.1rem; font-weight: 900; color: var(--app-primary-dark); margin-bottom: 8px; }
    .product-price .unit { font-size: 0.72rem; font-weight: 600; color: var(--app-text-sub); }
    .product-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 0.74rem; color: var(--app-text-sub); }
    .product-actions { display: flex; gap: 7px; }
    .btn-cart { flex: 1; padding: 9px; background: var(--app-primary-light); color: var(--app-primary-dark); border: none; border-radius: var(--r-sm); font-size: 0.82rem; font-weight: 800; cursor: pointer; font-family: inherit; transition: var(--tr); }
    .btn-cart:hover { background: var(--app-primary); color: #fff; }
    .btn-buy { flex: 1; padding: 9px; background: var(--app-primary); color: #fff; border: none; border-radius: var(--r-sm); font-size: 0.82rem; font-weight: 800; cursor: pointer; font-family: inherit; transition: var(--tr); }
    .btn-buy:hover { background: var(--app-primary-dark); }
    /* 상단 정렬/검색 바 */
    .shop-topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .shop-search { flex: 1; min-width: 200px; position: relative; }
    .shop-search input { padding-left: 34px; }
    .shop-search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--app-text-muted); }
    .sort-select { padding: 10px 12px; border: 1.5px solid var(--app-border-mid); border-radius: var(--r-sm); font-size: 0.84rem; font-weight: 600; color: var(--app-text); background: var(--app-surface); font-family: inherit; cursor: pointer; }
    .result-count { font-size: 0.82rem; color: var(--app-text-sub); font-weight: 600; white-space: nowrap; }
    /* ── 장바구니 플로팅 버튼 ── */
    .cart-fab { position: fixed; bottom: 28px; right: 24px; background: var(--app-primary); color: #fff; border: none; border-radius: var(--r-full); padding: 14px 22px; font-size: 0.95rem; font-weight: 800; cursor: pointer; box-shadow: var(--shadow-lg); z-index: 900; display: flex; align-items: center; gap: 8px; transition: var(--tr); font-family: inherit; }
    .cart-fab:hover { background: var(--app-primary-dark); transform: translateY(-2px); }
    .cart-fab-count { background: #ef4444; color: #fff; border-radius: 50%; width: 20px; height: 20px; font-size: 0.7rem; font-weight: 900; display: flex; align-items: center; justify-content: center; }
    /* ── 장바구니 서랍 ── */
    .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 2000; display: none; }
    .cart-overlay.show { display: block; }
    .cart-drawer { position: fixed; right: 0; top: 0; bottom: 0; width: 380px; max-width: 100vw; background: var(--app-surface); box-shadow: var(--shadow-lg); z-index: 2001; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .3s cubic-bezier(.4,0,.2,1); }
    .cart-drawer.open { transform: translateX(0); }
    .cart-drawer-header { padding: 20px; border-bottom: 1px solid var(--app-border); display: flex; align-items: center; justify-content: space-between; }
    .cart-drawer-title { font-size: 1rem; font-weight: 800; }
    .cart-drawer-close { background: var(--app-bg); border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-size: 0.9rem; }
    .cart-items { flex: 1; overflow-y: auto; padding: 12px 20px; }
    .cart-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--app-border); }
    .cart-item:last-child { border-bottom: none; }
    .cart-item-emoji { font-size: 1.8rem; flex-shrink: 0; width: 44px; height: 44px; border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center; background: var(--app-bg); }
    .cart-item-info { flex: 1; }
    .cart-item-name { font-size: 0.88rem; font-weight: 700; }
    .cart-item-price { font-size: 0.8rem; color: var(--app-text-sub); margin-top: 2px; }
    .cart-qty { display: flex; align-items: center; gap: 6px; }
    .qty-btn { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--app-border-mid); background: var(--app-bg); cursor: pointer; font-size: 0.9rem; font-weight: 800; display: flex; align-items: center; justify-content: center; transition: var(--tr); }
    .qty-btn:hover { background: var(--app-primary-light); border-color: var(--app-primary); }
    .qty-num { font-size: 0.88rem; font-weight: 800; min-width: 20px; text-align: center; }
    .cart-del { background: none; border: none; color: var(--app-text-muted); cursor: pointer; font-size: 1rem; padding: 4px; }
    .cart-footer { padding: 16px 20px; border-top: 1px solid var(--app-border); background: var(--app-surface); }
    .cart-total-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.88rem; }
    .cart-total-val { font-weight: 900; color: var(--app-primary-dark); font-size: 1.05rem; }
    .cart-empty { text-align: center; padding: 60px 0; color: var(--app-text-muted); }
    /* ── 결제 모달 ── */
    .pay-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 3000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .pay-overlay.show { display: flex; }
    .pay-modal { background: #fff; border-radius: 24px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); animation: modalPop .25s ease; }
    @keyframes modalPop { from{transform:scale(.9);opacity:0} to{transform:scale(1);opacity:1} }
    .pay-header { padding: 22px 24px 0; display: flex; justify-content: space-between; align-items: center; }
    .pay-title { font-size: 1.1rem; font-weight: 900; }
    .pay-close { background: var(--app-bg); border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-size: 0.9rem; }
    .pay-body { padding: 20px 24px 24px; }
    .pay-method-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
    .pay-method-btn { padding: 14px 10px; border: 2px solid var(--app-border-mid); border-radius: var(--r-md); background: var(--app-bg); font-size: 0.82rem; font-weight: 700; cursor: pointer; font-family: inherit; transition: var(--tr); text-align: center; }
    .pay-method-btn:hover { border-color: var(--app-primary); background: var(--app-primary-light); }
    .pay-method-btn.selected { border-color: var(--app-primary); background: var(--app-primary-light); color: var(--app-primary-dark); }
    .pay-method-icon { font-size: 1.5rem; display: block; margin-bottom: 5px; }
    .pay-card-fields { display: none; }
    .pay-card-fields.show { display: block; }
    .card-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pay-summary { background: var(--app-bg); border-radius: var(--r-md); padding: 14px; margin: 16px 0; }
    .pay-sum-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 4px 0; }
    .pay-sum-total { font-weight: 900; font-size: 1rem; color: var(--app-primary-dark); border-top: 1px solid var(--app-border); margin-top: 6px; padding-top: 8px; }
    /* 완료 화면 */
    .pay-done { text-align: center; padding: 20px 0 10px; display: none; }
    .pay-done.show { display: block; }
    .pay-done-icon { font-size: 3.5rem; margin-bottom: 12px; }
    .pay-done-title { font-size: 1.2rem; font-weight: 900; margin-bottom: 6px; }
    .pay-done-sub { font-size: 0.88rem; color: var(--app-text-sub); }
    .pay-order-num { font-size: 0.78rem; color: var(--app-text-muted); margin-top: 10px; }
    @media(max-width:960px){ .shop-layout{grid-template-columns:1fr;} .filter-side{position:static;} .product-grid{grid-template-columns:repeat(2,1fr);} .cart-drawer{width:100%;} }
    @media(max-width:480px){ .product-grid{grid-template-columns:1fr;} }
  </style>
</head>
<body>

<header class="app-header" id="appHeader">
  <div class="app-header-inner">
    <a href="../index.html" class="app-logo">
      <div class="app-logo-icon"><img src="../assets/images/hero-main.png" alt="제주모아" /></div>
      <span class="app-logo-text">제주<span>모아</span></span>
    </a>
    <nav class="app-nav">
      <a href="../index.html" class="app-nav-link">홈</a>
      <a href="shop.html" class="app-nav-link active">🛒 쇼핑</a>
      <a href="eco-produce.html" class="app-nav-link">친환경 정보</a>
    </nav>
    <div class="app-header-user">
      <div class="app-user-chip">
        <div class="app-user-avatar" id="userAvatar">?</div>
        <div class="app-user-info"><span class="app-user-name" data-user-name>-</span><span class="app-user-role" data-user-role>-</span></div>
      </div>
      <button class="app-logout-btn" data-logout-btn>로그아웃</button>
    </div>
  </div>
</header>

<div class="app-page-bar">
  <div class="app-container">
    <div class="app-page-bar-inner">
      <div class="app-page-bar-left">
        <span class="app-page-tag">🛒 소비자</span>
        <h1 class="app-page-title">제주 농산물 <span>직거래 쇼핑</span></h1>
      </div>
      <div style="font-size:0.82rem;color:var(--app-text-sub);font-weight:600;">생산자 직접 배송 · 신선도 보장</div>
    </div>
  </div>
</div>

<main class="app-main">
  <div class="app-container">
    <div class="shop-layout">

      <!-- 사이드 필터 -->
      <aside class="filter-side">
        <div class="app-card">
          <div class="filter-group">
            <div class="filter-group-title">인증 종류</div>
            <label class="filter-check"><input type="checkbox" data-f="organic" onchange="applyFilters()" /> 🌿 유기농</label>
            <label class="filter-check"><input type="checkbox" data-f="noagri" onchange="applyFilters()" /> 🚫 무농약</label>
            <label class="filter-check"><input type="checkbox" data-f="gap"    onchange="applyFilters()" /> ✅ GAP</label>
          </div>
          <hr class="app-divider" />
          <div class="filter-group">
            <div class="filter-group-title">카테고리</div>
            <label class="filter-check"><input type="checkbox" data-f="citrus" onchange="applyFilters()" /> 🍊 감귤류</label>
            <label class="filter-check"><input type="checkbox" data-f="veg"    onchange="applyFilters()" /> 🥦 채소류</label>
            <label class="filter-check"><input type="checkbox" data-f="root"   onchange="applyFilters()" /> 🥕 뿌리채소</label>
          </div>
          <hr class="app-divider" />
          <div class="filter-group">
            <div class="filter-group-title">가격대</div>
            <div class="price-range">
              <input type="range" id="priceRange" min="0" max="100000" step="5000" value="100000" oninput="updatePriceLabel();applyFilters()" />
              <div class="price-range-label">최대 <span id="priceLabel">10만원</span> 이하</div>
            </div>
          </div>
          <hr class="app-divider" />
          <div class="filter-group">
            <div class="filter-group-title">배송</div>
            <label class="filter-check"><input type="checkbox" data-f="free_ship" onchange="applyFilters()" /> 🚚 무료배송</label>
            <label class="filter-check"><input type="checkbox" data-f="fast"      onchange="applyFilters()" /> ⚡ 당일배송</label>
          </div>
          <button class="app-btn app-btn-secondary app-btn-full app-btn-sm" onclick="resetFilters()" style="margin-top:4px;">필터 초기화</button>
        </div>
      </aside>

      <!-- 상품 목록 -->
      <div>
        <div class="shop-topbar">
          <div class="shop-search">
            <span class="shop-search-icon">🔍</span>
            <input class="app-input" type="text" id="shopSearch" placeholder="상품명·농가·지역 검색" oninput="applyFilters()" />
          </div>
          <select class="sort-select" id="sortSelect" onchange="applyFilters()">
            <option value="recommend">추천순</option>
            <option value="price_asc">가격 낮은순</option>
            <option value="price_desc">가격 높은순</option>
            <option value="rating">평점순</option>
            <option value="new">신상품순</option>
          </select>
          <span class="result-count" id="resultCount">0개 상품</span>
        </div>
        <div class="product-grid" id="productGrid"></div>
      </div>
    </div>
  </div>
</main>

<!-- 장바구니 FAB -->
<button class="cart-fab" id="cartFab" onclick="openCart()">
  🛒 장바구니 <div class="cart-fab-count" id="cartCount">0</div>
</button>

<!-- 장바구니 오버레이 + 서랍 -->
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-drawer-header">
    <div class="cart-drawer-title">🛒 장바구니</div>
    <button class="cart-drawer-close" onclick="closeCart()">✕</button>
  </div>
  <div class="cart-items" id="cartItems">
    <div class="cart-empty">🛒<br>장바구니가 비어있어요</div>
  </div>
  <div class="cart-footer" id="cartFooter" style="display:none;">
    <div class="cart-total-row"><span>상품 합계</span><span id="cartSubtotal">₩0</span></div>
    <div class="cart-total-row"><span>배송비</span><span id="cartShip">₩3,000</span></div>
    <div class="cart-total-row pay-sum-total"><span>결제 금액</span><span class="cart-total-val" id="cartTotal">₩0</span></div>
    <button class="app-btn app-btn-primary app-btn-full" style="margin-top:12px;" onclick="openPayment()">💳 결제하기</button>
  </div>
</div>

<!-- 결제 모달 -->
<div class="pay-overlay" id="payOverlay">
  <div class="pay-modal" id="payModal">
    <div class="pay-header">
      <div class="pay-title" id="payModalTitle">💳 결제</div>
      <button class="pay-close" onclick="closePayment()">✕</button>
    </div>
    <div class="pay-body">

      <!-- 결제 완료 화면 -->
      <div class="pay-done" id="payDone">
        <div class="pay-done-icon">✅</div>
        <div class="pay-done-title">결제가 완료되었습니다!</div>
        <div class="pay-done-sub">신선한 제주 농산물이 곧 배송됩니다.</div>
        <div class="pay-order-num" id="payOrderNum">주문번호: -</div>
        <div style="margin-top:20px;display:flex;gap:8px;justify-content:center;">
          <button class="app-btn app-btn-primary app-btn-sm" onclick="closePayment()">쇼핑 계속하기</button>
          <button class="app-btn app-btn-secondary app-btn-sm" onclick="closePayment()">주문 확인</button>
        </div>
      </div>

      <!-- 결제 폼 -->
      <div id="payForm">
        <!-- 배송지 -->
        <div style="font-size:0.8rem;font-weight:800;color:var(--app-text-sub);margin-bottom:10px;text-transform:uppercase;">📦 배송지</div>
        <div class="app-field">
          <input class="app-input" type="text" id="payAddr" placeholder="배송 주소" />
        </div>
        <div class="app-field">
          <input class="app-input" type="text" id="payAddrDetail" placeholder="상세 주소" />
        </div>

        <!-- 결제 수단 -->
        <div style="font-size:0.8rem;font-weight:800;color:var(--app-text-sub);margin:14px 0 10px;text-transform:uppercase;">💳 결제 수단</div>
        <div class="pay-method-grid">
          <button class="pay-method-btn selected" data-pay="kakao" onclick="selPayMethod(this)">
            <span class="pay-method-icon">💛</span>카카오페이
          </button>
          <button class="pay-method-btn" data-pay="card" onclick="selPayMethod(this)">
            <span class="pay-method-icon">💳</span>신용카드
          </button>
          <button class="pay-method-btn" data-pay="naver" onclick="selPayMethod(this)">
            <span class="pay-method-icon">💚</span>네이버페이
          </button>
          <button class="pay-method-btn" data-pay="bank" onclick="selPayMethod(this)">
            <span class="pay-method-icon">🏦</span>계좌이체
          </button>
        </div>

        <!-- 카드 입력 (카드 선택 시) -->
        <div class="pay-card-fields" id="cardFields">
          <div class="app-field">
            <label class="app-label">카드 번호</label>
            <input class="app-input" type="text" id="cardNum" placeholder="0000 - 0000 - 0000 - 0000" maxlength="19" oninput="fmtCard(this)" />
          </div>
          <div class="card-row">
            <div class="app-field">
              <label class="app-label">유효기간</label>
              <input class="app-input" type="text" id="cardExp" placeholder="MM / YY" maxlength="7" oninput="fmtExp(this)" />
            </div>
            <div class="app-field">
              <label class="app-label">CVC</label>
              <input class="app-input" type="text" id="cardCvc" placeholder="000" maxlength="3" />
            </div>
          </div>
          <div class="app-field">
            <label class="app-label">카드 소유자</label>
            <input class="app-input" type="text" id="cardName" placeholder="홍길동" />
          </div>
        </div>

        <!-- 주문 요약 -->
        <div class="pay-summary">
          <div class="pay-sum-row"><span>상품 금액</span><span id="pSubtotal">₩0</span></div>
          <div class="pay-sum-row"><span>배송비</span><span>₩3,000</span></div>
          <div class="pay-sum-row"><span>할인</span><span style="color:var(--app-green-dark);" id="pDiscount">-₩0</span></div>
          <div class="pay-sum-row pay-sum-total"><span>최종 결제금액</span><span id="pTotal">₩0</span></div>
        </div>

        <button class="app-btn app-btn-primary app-btn-full app-btn-lg" id="payBtn" onclick="doPayment()">💳 결제하기</button>
      </div>
    </div>
  </div>
</div>

<div class="app-toast-wrap" id="toastWrap"></div>

<script src="../js/auth.js"></script>
<script>
JMAuth.requireLogin();
JMAuth.injectUserUI();
var user = JMAuth.currentUser();
if (user) document.getElementById('userAvatar').textContent = (user.name||'?')[0];
window.addEventListener('scroll',function(){document.getElementById('appHeader').classList.toggle('scrolled',window.scrollY>10);},{passive:true});

/* ── 상품 데이터 ── */
var PRODUCTS = [
  {id:1, emoji:'🍊', name:'궁천조생 감귤 5kg', farm:'한림 A농가', region:'제주시 한림읍', cert:'무농약', certType:'noagri', cat:'citrus', price:28000, rating:4.9, reviews:234, free_ship:true, fast:true,  brix:'10.8°', desc:'당도 높은 조생감귤'},

];

/* 소비자 정보에서 선호 로드 */
var csData = user ? JSON.parse(localStorage.getItem('jmoa_consumer_'+user.id)||'null') : null;
if (csData && csData.address) {
  document.getElementById('payAddr').value = csData.address;
  if (csData.addrDetail) document.getElementById('payAddrDetail').value = csData.addrDetail;
}

/* 장바구니 */
var CART_KEY = user ? 'jmoa_cart_'+user.id : null;
var cart = CART_KEY ? JSON.parse(localStorage.getItem(CART_KEY)||'[]') : [];
function saveCart(){ if(CART_KEY) localStorage.setItem(CART_KEY, JSON.stringify(cart)); }

/* 필터 상태 */
var maxPrice = 100000;
function updatePriceLabel(){
  maxPrice = parseInt(document.getElementById('priceRange').value);
  document.getElementById('priceLabel').textContent = (maxPrice/10000).toFixed(0)+'만원';
}

function getChecked(attr){
  return Array.from(document.querySelectorAll('[data-f]:checked')).map(function(el){return el.dataset[attr||'f'];});
}

function applyFilters(){
  var q      = document.getElementById('shopSearch').value.trim().toLowerCase();
  var active = getChecked('f');
  var sort   = document.getElementById('sortSelect').value;

  var certFilters = active.filter(function(f){return ['organic','noagri','gap'].indexOf(f)>-1;});
  var catFilters  = active.filter(function(f){return ['citrus','veg','root'].indexOf(f)>-1;});
  var shipFilters = active.filter(function(f){return ['free_ship','fast'].indexOf(f)>-1;});

  var filtered = PRODUCTS.filter(function(p){
    if(q && !(p.name.includes(q)||p.farm.includes(q)||p.region.includes(q))) return false;
    if(p.price > maxPrice) return false;
    if(certFilters.length && certFilters.indexOf(p.certType)<0) return false;
    if(catFilters.length  && catFilters.indexOf(p.cat)<0) return false;
    if(shipFilters.length){
      if(shipFilters.indexOf('free_ship')>-1 && !p.free_ship) return false;
      if(shipFilters.indexOf('fast')>-1 && !p.fast) return false;
    }
    return true;
  });

  if(sort==='price_asc')  filtered.sort(function(a,b){return a.price-b.price;});
  if(sort==='price_desc') filtered.sort(function(a,b){return b.price-a.price;});
  if(sort==='rating')     filtered.sort(function(a,b){return b.rating-a.rating;});

  renderProducts(filtered);
  document.getElementById('resultCount').textContent = filtered.length + '개 상품';
}

function resetFilters(){
  document.querySelectorAll('[data-f]').forEach(function(el){el.checked=false;});
  document.getElementById('priceRange').value = 100000;
  document.getElementById('shopSearch').value = '';
  updatePriceLabel(); applyFilters();
}

/* 상품 카드 렌더 */
function renderProducts(list){
  var certMap = {유기농:'app-badge-green', 무농약:'app-badge-blue', GAP:'app-badge-orange'};
  document.getElementById('productGrid').innerHTML = list.map(function(p){
    var inCart = cart.some(function(c){return c.id===p.id;});
    return '<div class="product-card" data-pid="'+p.id+'">'
      +'<div class="product-img '+(p.cat==='citrus'?'citrus':p.cat==='root'?'root':'veg')+'">'+p.emoji
      +'<div class="cert-badge">'+p.cert+'</div></div>'
      +'<div class="product-body">'
      +'<div class="product-name">'+p.name+'</div>'
      +'<div class="product-farm">'+p.farm+' · '+p.region+'</div>'
      +'<div class="product-price">₩'+p.price.toLocaleString()+' <span class="unit">/ 1박스</span></div>'
      +'<div class="product-meta">'
      +'<span>⭐ '+p.rating+'</span>'
      +'<span>('+p.reviews+')</span>'
      +(p.free_ship?'<span class="app-badge app-badge-green" style="font-size:0.65rem;">무료배송</span>':'')
      +(p.fast?'<span class="app-badge app-badge-blue" style="font-size:0.65rem;">당일</span>':'')
      +'</div>'
      +'<div class="product-actions">'
      +'<button class="btn-cart" onclick="addCart('+p.id+',event)">'+(inCart?'✓ 담김':'🛒 장바구니')+'</button>'
      +'<button class="btn-buy"  onclick="buyNow('+p.id+',event)">바로구매</button>'
      +'</div></div></div>';
  }).join('');
}

/* 장바구니 추가 */
function addCart(pid, e){
  if(e) e.stopPropagation();
  var p = PRODUCTS.find(function(x){return x.id===pid;});
  if(!p) return;
  var exist = cart.find(function(c){return c.id===pid;});
  if(exist){ exist.qty++; }
  else { cart.push({id:p.id, name:p.name, emoji:p.emoji, price:p.price, qty:1}); }
  saveCart(); updateCartBadge(); applyFilters();
  showToast(p.name+' 장바구니에 추가됨 🛒','success');
}

/* 바로 구매 */
function buyNow(pid, e){
  if(e) e.stopPropagation();
  addCart(pid, e);
  openCart();
}

function updateCartBadge(){
  var total = cart.reduce(function(s,c){return s+c.qty;},0);
  document.getElementById('cartCount').textContent = total;
  document.getElementById('cartFab').style.display = total>0?'':'none'; // 항상 보이게
}

/* 장바구니 서랍 */
function openCart(){
  document.getElementById('cartOverlay').classList.add('show');
  document.getElementById('cartDrawer').classList.add('open');
  renderCart();
}
function closeCart(){
  document.getElementById('cartOverlay').classList.remove('show');
  document.getElementById('cartDrawer').classList.remove('open');
}
function renderCart(){
  var itemsEl  = document.getElementById('cartItems');
  var footerEl = document.getElementById('cartFooter');
  if(!cart.length){
    itemsEl.innerHTML='<div class="cart-empty">🛒<br>장바구니가 비어있어요</div>';
    footerEl.style.display='none'; return;
  }
  var subtotal = cart.reduce(function(s,c){return s+c.price*c.qty;},0);
  var ship     = subtotal >= 50000 ? 0 : 3000;
  itemsEl.innerHTML = cart.map(function(c,i){
    return '<div class="cart-item">'
      +'<div class="cart-item-emoji">'+c.emoji+'</div>'
      +'<div class="cart-item-info">'
      +'<div class="cart-item-name">'+c.name+'</div>'
      +'<div class="cart-item-price">₩'+c.price.toLocaleString()+' / 1박스</div>'
      +'</div>'
      +'<div class="cart-qty">'
      +'<button class="qty-btn" onclick="changeQty('+i+',-1)">−</button>'
      +'<span class="qty-num">'+c.qty+'</span>'
      +'<button class="qty-btn" onclick="changeQty('+i+',1)">+</button>'
      +'</div>'
      +'<button class="cart-del" onclick="removeCart('+i+')">🗑</button>'
      +'</div>';
  }).join('');
  document.getElementById('cartSubtotal').textContent = '₩'+subtotal.toLocaleString();
  document.getElementById('cartShip').textContent     = ship===0?'무료':'₩'+ship.toLocaleString();
  document.getElementById('cartTotal').textContent    = '₩'+(subtotal+ship).toLocaleString();
  footerEl.style.display='';
}
function changeQty(i, delta){
  cart[i].qty = Math.max(1, cart[i].qty + delta);
  saveCart(); updateCartBadge(); renderCart();
}
function removeCart(i){
  cart.splice(i,1); saveCart(); updateCartBadge(); renderCart(); applyFilters();
}

/* 결제 모달 */
var selectedPayMethod = 'kakao';
function openPayment(){
  var subtotal = cart.reduce(function(s,c){return s+c.price*c.qty;},0);
  var ship     = subtotal>=50000?0:3000;
  var discount = Math.floor(subtotal*0.03);
  document.getElementById('pSubtotal').textContent = '₩'+subtotal.toLocaleString();
  document.getElementById('pDiscount').textContent = '-₩'+discount.toLocaleString();
  document.getElementById('pTotal').textContent    = '₩'+(subtotal+ship-discount).toLocaleString();
  document.getElementById('payForm').style.display='';
  document.getElementById('payDone').classList.remove('show');
  document.getElementById('payModalTitle').textContent='💳 결제';
  closeCart();
  document.getElementById('payOverlay').classList.add('show');
}
function closePayment(){
  document.getElementById('payOverlay').classList.remove('show');
}
function selPayMethod(btn){
  document.querySelectorAll('.pay-method-btn').forEach(function(b){b.classList.remove('selected');});
  btn.classList.add('selected');
  selectedPayMethod = btn.dataset.pay;
  document.getElementById('cardFields').classList.toggle('show', selectedPayMethod==='card');
}
function fmtCard(el){
  var v=el.value.replace(/\D/g,'').substring(0,16);
  el.value=v.replace(/(.{4})/g,'$1 ').trim();
}
function fmtExp(el){
  var v=el.value.replace(/\D/g,'').substring(0,4);
  if(v.length>2) v=v.slice(0,2)+' / '+v.slice(2);
  el.value=v;
}
function doPayment(){
  var addr = document.getElementById('payAddr').value.trim();
  if(!addr){showToast('배송지를 입력해주세요.','error');return;}
  if(selectedPayMethod==='card'){
    var cn = (document.getElementById('cardNum').value||'').replace(/\s/g,'');
    if(cn.length<16){showToast('카드번호를 정확히 입력해주세요.','error');return;}
  }
  var btn=document.getElementById('payBtn');
  btn.disabled=true; btn.textContent='결제 처리 중...';
  setTimeout(function(){
    /* 주문 저장 */
    var orderId = 'JM-'+Date.now();
    var subtotal = cart.reduce(function(s,c){return s+c.price*c.qty;},0);
    var ship     = subtotal>=50000?0:3000;
    var discount = Math.floor(subtotal*0.03);
    var order = {id:orderId, items:cart.slice(), total:subtotal+ship-discount, addr:addr, method:selectedPayMethod, createdAt:new Date().toLocaleDateString('ko-KR'), status:'결제완료'};
    if(user){
      var ok='jmoa_orders_'+user.id;
      var orders=JSON.parse(localStorage.getItem(ok)||'[]');
      orders.unshift(order); localStorage.setItem(ok,JSON.stringify(orders));
    }
    /* 장바구니 비우기 */
    cart=[]; saveCart(); updateCartBadge(); applyFilters();
    /* 완료 화면 */
    document.getElementById('payForm').style.display='none';
    document.getElementById('payDone').classList.add('show');
    document.getElementById('payOrderNum').textContent='주문번호: '+orderId;
    document.getElementById('payModalTitle').textContent='결제 완료';
    btn.disabled=false; btn.textContent='💳 결제하기';
    if(user){
      var ak='jmoa_activity_'+user.id;
      var al=JSON.parse(localStorage.getItem(ak)||'[]');
      al.unshift({icon:'🛒',colorClass:'ic-blue',title:'주문 완료',sub:'₩'+(subtotal+ship-discount).toLocaleString(),time:new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})});
      if(al.length>20)al=al.slice(0,20); localStorage.setItem(ak,JSON.stringify(al));
    }
  },1200);
}

function showToast(msg,type){
  var wrap=document.getElementById('toastWrap');
  var t=document.createElement('div'); t.className='app-toast'+(type?' '+type:''); t.textContent=msg;
  wrap.appendChild(t); requestAnimationFrame(function(){t.classList.add('show');});
  setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove();},300);},2800);
}

/* 초기화 */
updatePriceLabel();
applyFilters();
updateCartBadge();
</script>
